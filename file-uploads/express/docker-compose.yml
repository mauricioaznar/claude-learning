# Shared dev storage for BOTH modules. This is dev infrastructure, not part of
# either zippable module. Run `docker compose up -d` once, then start a server.
#
#   MinIO S3 API : http://localhost:9000  (what the SDK talks to)
#   MinIO console: http://localhost:9001  (browser UI, login minioadmin/minioadmin)
#
# MinIO is permissive about CORS by default, so the browser -> storage upload
# works locally with no extra config. Real AWS is NOT — see README-dev.md.

services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the `uploads` bucket, then exit.
  createbucket:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/uploads;
      exit 0;
      "

volumes:
  minio-data:
